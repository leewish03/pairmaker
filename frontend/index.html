<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎲 그룹교제 조편성</title>
</head>
<body>
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        const { useState, useEffect } = React;

        fetch('PairMaker.jsx')
            .then(res => {
                if (!res.ok) throw new Error('PairMaker.jsx 로드 실패: ' + res.status);
                return res.text();
            })
            .then(code => {
                // JS import 문만 제거 (CSS @import 보존)
                code = code.replace(/^import\s+.*;$/gm, '');
                // React 전역 객체 바인딩
                code = 'const { useState, useEffect } = React;\n' + code;
                // export default 제거
                code = code.replace(/export\s+default\s+function\s+/g, 'function ');

                const compiled = Babel.transform(code, {
                    presets: ['react'],
                    plugins: []
                }).code;

                const finalScript =
                    compiled + '\n' +
                    'const root = ReactDOM.createRoot(document.getElementById("root"));\n' +
                    'root.render(React.createElement(PairMaker));';

                const el = document.createElement('script');
                el.textContent = finalScript;
                document.body.appendChild(el);
            })
            .catch(err => {
                console.error('앱 로드 오류:', err);
                document.getElementById('root').innerHTML =
                    '<div style="padding:2rem;text-align:center;font-family:sans-serif;">' +
                    '<h2>⚠️ 앱을 불러오지 못했습니다</h2>' +
                    '<pre style="color:red;">' + err.message + '</pre>' +
                    '</div>';
            });
    </script>
</body>
</html>
